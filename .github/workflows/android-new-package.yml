name: Build New Android Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'وسم الإصدار الجديد، مثال: v2.0.0'
        required: true
        default: 'v2.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-new-package:
    name: Build and publish separately signed APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build the offline web app
        run: |
          npm ci
          npm run build

      - name: Generate a new signing key inside this Action
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/new-signing"
          KEYSTORE="$RUNNER_TEMP/new-signing/sondsss-v2.keystore"
          KEY_PASSWORD="$(openssl rand -hex 32)"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass "$KEY_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias sondsss-v2 \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Sondsss V2, OU=Android, O=Sondsss, L=Local, S=Local, C=EG"
          {
            echo "KEYSTORE=$KEYSTORE"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          chmod 600 "$KEYSTORE"

      - name: Build APK with the new package id
        working-directory: android
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          ./gradlew --no-daemon assembleDebug \
            -PappId=com.sonds.totti.v2 \
            -PappVersionCode=$((2000 + RUN_NUMBER)) \
            -PappVersionName="$VERSION"
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          APKSIGNER=$(find "$SDK_PATH/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias sondsss-v2 \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$GITHUB_WORKSPACE/Sondsss-V2.apk" \
            "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          "$APKSIGNER" verify --verbose "$GITHUB_WORKSPACE/Sondsss-V2.apk"
          sha256sum "$GITHUB_WORKSPACE/Sondsss-V2.apk" > "$GITHUB_WORKSPACE/Sondsss-V2.apk.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sondsss-V2-Android-APK
          path: |
            Sondsss-V2.apk
            Sondsss-V2.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish separate GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" Sondsss-V2.apk Sondsss-V2.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "سندس دي أنا - حزمة Android الجديدة $RELEASE_TAG" \
            --notes "حزمة Android جديدة بمعرف تطبيق com.sonds.totti.v2 وتوقيع جديد تم توليده داخل GitHub Actions. تُثبت بجانب النسخة القديمة com.sonds.totti."
